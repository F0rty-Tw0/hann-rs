[package]
name = "hann-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
authors = ["Artiom Tofan <artiomtofancv@gmail.com>"]
description = "Hann window generation and energy calculations for digital signal processing"
license = "MIT"
repository = "https://github.com/F0rty-Tw0/hann-rs"
documentation = "https://docs.rs/hann-rs"
readme = "README.md"
keywords = ["hann-window", "signal-processing", "dsp", "audio", "fft"]
categories = ["audio", "science", "mathematics"]
exclude = ["/.github/**", "/.gitignore"]

[dev-dependencies]
criterion = "0.8"
plotters = { version = "0.3.7", default-features = false, features = [
    "svg_backend",
    "line_series",
    "point_series",
]}

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "bench"
harness = false
